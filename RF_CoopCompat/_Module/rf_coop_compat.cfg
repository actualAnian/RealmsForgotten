# ============================================================================
# RF_CoopCompat - configuracao da camada de compatibilidade RF <-> Coop
# ----------------------------------------------------------------------------
# Este arquivo controla o que o Realms Forgotten pode fazer DENTRO de uma
# sessao coop. Fora de sessao coop (singleplayer normal) nada disso se aplica.
#
# Sintaxe (uma diretiva por linha, '#' comenta):
#   default <policy>            politica padrao para CampaignBehaviors do RF
#   policy <pattern> <policy>   politica para tipos especificos
#   assembly <name>             assembly adicional a incluir na varredura
#   unpatch_client <harmonyId>  remove patches Harmony deste dono NO CLIENTE
#                               quando a sessao coop inicia
#   unpatch_session <harmonyId> remove patches deste dono em AMBOS os lados
#                               quando a sessao coop inicia
#   set <key> <value>           flags gerais
#
# <policy>:
#   disabled    RegisterEvents nao roda em nenhum lado durante a sessao coop.
#               SyncData continua rodando -> o save permanece integro, o
#               conteudo do RF (mapa/tropas/itens/cenas) existe, mas o sistema
#               fica dormente. ESTE E O PADRAO (estabilidade primeiro).
#   hostonly    RegisterEvents roda so no host. USE COM CUIDADO: o host do Coop
#               e um servidor dedicado SEM Hero.MainHero nem MainParty. Um
#               behavior que dereferencia MainHero/MainParty VAI CRASHAR o host.
#               So marque hostonly um behavior de simulacao de MUNDO que ja foi
#               verificado como seguro sem MainHero (hordas/economia entre IA).
#   everywhere  RegisterEvents roda normalmente nos dois lados. So para
#               behaviors comprovadamente locais e inofensivos (UI, dialogo).
#
# <pattern>: casa se o FullName do tipo COMECA com o padrao, ou se o nome
#            simples da classe e igual ao padrao.
#
# ESTRATEGIA: comece com tudo 'disabled' (baseline estavel). Depois de validar
# em playtest, promova UM sistema por vez para 'hostonly'/'everywhere' e teste
# de novo. Nunca promova em lote.
# ============================================================================

default disabled

# ----------------------------------------------------------------------------
# A partir daqui: excecoes que voce for validando. Comece VAZIO (tudo disabled).
# Exemplos de candidatos a promover cedo (descomente e teste um por um):
#   policy RFWeatherCampaignBehavior hostonly     # clima e cosmetico/mundo
#   policy BarbarianHordeInvasion hostonly        # simulacao de mundo (validar MainHero)
# ----------------------------------------------------------------------------

# --- Patches Harmony removidos no CLIENTE ao iniciar sessao coop ------------
# Religion: postfix em ChangeRelationAction.ApplyInternal duplicaria efeitos
# quando o cliente aplica mensagens replicadas do host.
unpatch_client com.realmsforgotten.religion
# Sondas de diagnostico do RF (nao fazem sentido no cliente coop)
unpatch_client realmsforgotten.tickprobe
unpatch_client realmsforgotten.freezeprobe
unpatch_client realmsforgotten.manual.equipmentdiagnostics

# --- Patches Harmony removidos em AMBOS os lados ao iniciar sessao coop -----
# RF_BattleAI troca o cerebro tatico (TeamAIComponent). Em batalha coop o
# modelo dono/fantoche do Coop assume; manter o RF_BattleAI ativo e risco de
# dessincronizacao ate ser validado. Comente a linha para testar com ele.
unpatch_session RealmsForgotten.BattleAI

# --- Flags gerais ------------------------------------------------------------
# Bloqueia OnMissionBehaviorInitialize dos submodulos RF durante sessao coop
# (magia, dual wield, promoted etc. nao injetam MissionLogic em batalha coop).
set disable_mission_logic true

# Destrava o bloqueio de DLC do Coop (ValidateNoDlc) para permitir CONECTAR com
# o War Sails ativo, que o RF exige. Sem isto, host e cliente nunca conectam.
# ATENCAO: isto so libera a conexao; sincronizar os sistemas navais e uma
# fronteira separada (o Coop nunca rodou com War Sails).
set allow_dlc true
